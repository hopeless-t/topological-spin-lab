name: generate-exp002-reference

on:
  push:
    branches:
      - evidence/exp002-reference
    paths:
      - .github/workflows/_generate-exp002-reference.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence/exp002-reference
          path: repo

      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: 7a9a3ade0fa4bffa74cee61f1e59419ea60eff89
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Install canonical source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./source[dev]"

      - name: Test canonical source
        working-directory: source
        env:
          MPLBACKEND: Agg
        run: pytest

      - name: Generate EXP-002 reference evidence
        working-directory: source
        env:
          MPLBACKEND: Agg
        run: |
          python -m topological_spin_lab run \
            specs/EXP-002.json \
            --out ../candidate
          rm -rf ../candidate/figures

      - name: Review candidate
        run: |
          python - <<'PY'
          import csv, json, math, pathlib
          root = pathlib.Path("candidate")
          manifest = json.loads((root / "manifest.json").read_text())
          metrics = json.loads((root / "metrics.json").read_text())

          assert manifest["experiment_id"] == "EXP-002"
          assert manifest["git_commit"] == "7a9a3ade0fa4bffa74cee61f1e59419ea60eff89"
          assert manifest["status"] == "PASS"
          assert metrics["status"] == "PASS"
          assert len(metrics["checks"]) == 11
          assert all(item["passed"] for item in metrics["checks"])

          with (root / "spectrum.csv").open() as handle:
              spectrum = list(csv.DictReader(handle))
          with (root / "spin_ring.csv").open() as handle:
              spin = list(csv.DictReader(handle))

          assert len(spectrum) == 201
          assert len(spin) == 144
          assert {row["band"] for row in spin} == {"lower", "upper"}

          zero = min(spectrum, key=lambda row: abs(float(row["kx_Ainv"])))
          gap = float(zero["upper_eV"]) - float(zero["lower_eV"])
          assert math.isclose(gap, 0.040, rel_tol=0.0, abs_tol=1e-12)

          upper_sz = [float(row["sz"]) for row in spin if row["band"] == "upper"]
          lower_sz = [float(row["sz"]) for row in spin if row["band"] == "lower"]
          assert all(value > 0.0 for value in upper_sz)
          assert all(value < 0.0 for value in lower_sz)

          for row in spectrum + spin:
              for key, value in row.items():
                  if key == "band":
                      continue
                  assert math.isfinite(float(value))
          PY

      - name: Stage canonical evidence
        run: |
          mkdir -p repo/evidence/EXP-002/reference
          cp candidate/manifest.json repo/evidence/EXP-002/reference/manifest.json
          cp candidate/metrics.json repo/evidence/EXP-002/reference/metrics.json
          cp candidate/spectrum.csv repo/evidence/EXP-002/reference/spectrum.csv
          cp candidate/spin_ring.csv repo/evidence/EXP-002/reference/spin_ring.csv

      - name: Commit canonical evidence to branch
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/EXP-002/reference/manifest.json \
                  evidence/EXP-002/reference/metrics.json \
                  evidence/EXP-002/reference/spectrum.csv \
                  evidence/EXP-002/reference/spin_ring.csv
          git commit -m "evidence: add EXP-002 canonical reference"
          git push origin HEAD:evidence/exp002-reference

      - name: Upload reviewed candidate
        uses: actions/upload-artifact@v4
        with:
          name: exp002-reference-reviewed
          path: candidate/
          if-no-files-found: error
          retention-days: 30
