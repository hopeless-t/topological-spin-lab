name: exp004-c15-regulator-neighborhood

on:
  push:
    branches:
      - research/exp004-reentry-2026-09-25
    paths:
      - research/exp004_c15_regulator_neighborhood.py
      - research/exp004_c14_transport_acceptance_surface.py
      - research/exp004_c13_clean_scattering.py
      - .github/workflows/exp004-c15-regulator-neighborhood.yml
  workflow_dispatch:

concurrency:
  group: exp004-c15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regulator-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system numerical/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran libopenblas-dev liblapack-dev \
            pkg-config ninja-build meson cmake

      - name: Install NumPy-2 build/runtime tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy==2.5.3" "scipy==1.18.1" \
            "meson-python==0.22.1" "ninja==1.13.2" "cython==3.3.0" \
            "packaging==26.3" "setuptools-scm==10.3.4"

      - name: Cache pinned Kwant wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/topological-spin-lab/kwant-wheels
          key: ${{ runner.os }}-x64-cp312-kwant-ef12fa0d7-numpy-2.5.3

      - name: Build or reuse pinned Kwant wheel
        run: |
          WHEEL_DIR="$HOME/.cache/topological-spin-lab/kwant-wheels"
          mkdir -p "$WHEEL_DIR"
          if ! find "$WHEEL_DIR" -maxdepth 1 -name 'kwant-1.5.1.dev68+gef12fa0d7-*.whl' | grep -q .; then
            python -m pip wheel --no-build-isolation --no-deps \
              --wheel-dir "$WHEEL_DIR" \
              "git+https://gitlab.kwant-project.org/kwant/kwant.git@ef12fa0d7"
          fi
          python -m pip install "tinyarray==1.2.5"
          python -m pip install --no-deps "$WHEEL_DIR"/kwant-1.5.1.dev68+gef12fa0d7-*.whl

      - name: Run EXP-004 C15 regulator-neighborhood sensitivity
        run: |
          python research/exp004_c15_regulator_neighborhood.py \
            --out runs/EXP-004-C15/regulator-neighborhood.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp004-c15-regulator-neighborhood
          path: runs/EXP-004-C15/*.json
          if-no-files-found: ignore
