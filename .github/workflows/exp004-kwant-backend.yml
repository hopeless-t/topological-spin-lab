name: exp004-kwant-backend-qualification

on:
  push:
    branches:
      - research/exp004-reentry-2026-09-25
    paths:
      - research/exp004_kwant_backend_smoke.py
      - .github/workflows/exp004-kwant-backend.yml

jobs:
  kwant-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran libopenblas-dev liblapack-dev

      - name: Install canonical numerical stack and Kwant stable
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy>=2,<3" "scipy>=1.14,<2" "tinyarray>=1.2.2"
          python -m pip install --no-build-isolation "kwant==1.5.0"

      - name: Run deterministic Kwant known-answer smoke
        run: |
          python research/exp004_kwant_backend_smoke.py \
            --out runs/EXP-004-backend/kwant-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: exp004-kwant-backend-smoke
          path: runs/EXP-004-backend/kwant-smoke.json
          if-no-files-found: error
