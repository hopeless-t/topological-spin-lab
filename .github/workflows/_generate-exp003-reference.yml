name: generate-exp003-reference

on:
  push:
    branches:
      - evidence/exp003-reference
    paths:
      - .github/workflows/_generate-exp003-reference.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence/exp003-reference
          path: repo

      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: c4daf00e5c0b04d32580f1a659b6d6bb6fab2f79
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Install canonical source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./source[dev]"

      - name: Test canonical source
        working-directory: source
        env:
          MPLBACKEND: Agg
        run: pytest

      - name: Generate EXP-003 reference evidence
        working-directory: source
        env:
          MPLBACKEND: Agg
        run: |
          python -m topological_spin_lab run \
            specs/EXP-003.json \
            --out ../candidate
          rm -rf ../candidate/figures

      - name: Review candidate
        run: |
          python - <<'PY'
          import csv, json, math, pathlib
          root = pathlib.Path("candidate")
          manifest = json.loads((root / "manifest.json").read_text())
          metrics = json.loads((root / "metrics.json").read_text())

          assert manifest["experiment_id"] == "EXP-003"
          assert manifest["git_commit"] == "c4daf00e5c0b04d32580f1a659b6d6bb6fab2f79"
          assert manifest["status"] == "PASS"
          assert metrics["status"] == "PASS"
          assert len(metrics["checks"]) == 10
          assert all(item["passed"] for item in metrics["checks"])

          with (root / "profile.csv").open() as handle:
              profile = list(csv.DictReader(handle))
          with (root / "dispersion.csv").open() as handle:
              dispersion = list(csv.DictReader(handle))

          assert len(profile) == 241
          assert len(dispersion) == 101

          center = min(profile, key=lambda row: abs(float(row["x_A"])))
          peak = max(float(row["probability_density_Ainv"]) for row in profile)
          assert math.isclose(float(center["x_A"]), 0.0, rel_tol=0.0, abs_tol=1e-12)
          assert math.isclose(float(center["mass_eV"]), 0.0, rel_tol=0.0, abs_tol=1e-12)
          assert math.isclose(
              float(center["probability_density_Ainv"]),
              peak,
              rel_tol=0.0,
              abs_tol=1e-15,
          )

          negative = dispersion[0]
          zero = min(dispersion, key=lambda row: abs(float(row["ky_Ainv"])))
          positive = dispersion[-1]
          assert float(negative["energy_eV"]) < 0.0
          assert math.isclose(float(zero["energy_eV"]), 0.0, rel_tol=0.0, abs_tol=1e-12)
          assert float(positive["energy_eV"]) > 0.0
          assert all(float(row["binding_margin_eV"]) > 0.0 for row in dispersion)

          assert metrics["metrics"]["max_operator_residual_eV"] <= 1e-12
          assert metrics["metrics"]["finite_window_norm_error"] <= 1e-8
          assert metrics["metrics"]["max_reversal_dispersion_error_eV"] <= 1e-12
          assert metrics["metrics"]["max_reversal_spin_error"] <= 1e-10

          for row in profile + dispersion:
              for value in row.values():
                  assert math.isfinite(float(value))
          PY

      - name: Stage canonical evidence
        run: |
          mkdir -p repo/evidence/EXP-003/reference
          cp candidate/manifest.json repo/evidence/EXP-003/reference/manifest.json
          cp candidate/metrics.json repo/evidence/EXP-003/reference/metrics.json
          cp candidate/profile.csv repo/evidence/EXP-003/reference/profile.csv
          cp candidate/dispersion.csv repo/evidence/EXP-003/reference/dispersion.csv

      - name: Commit canonical evidence to branch
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/EXP-003/reference/manifest.json \
                  evidence/EXP-003/reference/metrics.json \
                  evidence/EXP-003/reference/profile.csv \
                  evidence/EXP-003/reference/dispersion.csv
          git commit -m "evidence: add EXP-003 canonical reference"
          git push origin HEAD:evidence/exp003-reference

      - name: Upload reviewed candidate
        uses: actions/upload-artifact@v4
        with:
          name: exp003-reference-reviewed
          path: candidate/
          if-no-files-found: error
          retention-days: 30
