name: ci

on:
  # Use push/current-diff filtering rather than pull_request filtering.  On a
  # long-lived research PR, pull_request.paths evaluates the cumulative PR diff
  # and would keep re-running the whole suite after any qualifying file changed
  # once.  Push paths react only to the current checkpoint.
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "src/**"
      - "tests/**"
      - "specs/**"
      - "research/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Run EXP-001
        run: |
          python -m topological_spin_lab run \
            specs/EXP-001.json \
            --out runs/EXP-001-ci

      - name: Run EXP-002
        run: |
          python -m topological_spin_lab run \
            specs/EXP-002.json \
            --out runs/EXP-002-ci

      - name: Run EXP-003
        run: |
          python -m topological_spin_lab run \
            specs/EXP-003.json \
            --out runs/EXP-003-ci

      - name: Validate VAL-001
        run: |
          python -m topological_spin_lab validate \
            specs/VAL-001.json \
            --out runs/VAL-001-ci

      - name: Run VAL-001 threshold sensitivity
        run: |
          python research/val001_threshold_sensitivity.py \
            runs/VAL-001-ci/summary.json \
            --out runs/VAL-001-ci/threshold_sensitivity.json

      - name: Run VAL-003 numerical trust pilot
        run: |
          python research/val003_numerical_trust_pilot.py \
            --out runs/VAL-003-ci/numerical_trust_pilot.json

      - name: Run EXP-004 C12 cost qualification
        run: |
          python research/exp004_c12_cost_qualification.py \
            --out runs/EXP-004-C12-ci/cost_qualification.json
