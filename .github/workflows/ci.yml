name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Run EXP-001
        run: |
          python -m topological_spin_lab run \
            specs/EXP-001.json \
            --out runs/EXP-001-ci

      - name: Run EXP-002
        run: |
          python -m topological_spin_lab run \
            specs/EXP-002.json \
            --out runs/EXP-002-ci
