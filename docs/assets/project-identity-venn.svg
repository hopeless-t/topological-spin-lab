<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">topological-spin-lab project identity</title>
  <desc id="desc">A three-circle Venn diagram showing the project at the intersection of computational physics, reproducible experiments, and literature-grounded research.</desc>

  <rect width="1200" height="760" rx="28" fill="#ffffff"/>

  <text x="600" y="62" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="700" fill="#172033">
    Project identity
  </text>
  <text x="600" y="98" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" fill="#5d677a">
    A reproducible computational-physics lab grounded in primary literature
  </text>

  <circle cx="420" cy="365" r="245" fill="#4c78a8" fill-opacity="0.20" stroke="#4c78a8" stroke-width="3"/>
  <circle cx="780" cy="365" r="245" fill="#59a14f" fill-opacity="0.20" stroke="#59a14f" stroke-width="3"/>
  <circle cx="600" cy="535" r="245" fill="#f28e2b" fill-opacity="0.20" stroke="#f28e2b" stroke-width="3"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="300" y="235" text-anchor="middle" font-size="23" font-weight="700">Computational Physics</text>
    <text x="300" y="265" text-anchor="middle" font-size="15" fill="#445067">effective Hamiltonians</text>
    <text x="300" y="288" text-anchor="middle" font-size="15" fill="#445067">spectra · spin · transport</text>

    <text x="900" y="235" text-anchor="middle" font-size="23" font-weight="700">Reproducible Experiments</text>
    <text x="900" y="265" text-anchor="middle" font-size="15" fill="#445067">strict specs · checks</text>
    <text x="900" y="288" text-anchor="middle" font-size="15" fill="#445067">evidence · provenance</text>

    <text x="600" y="690" text-anchor="middle" font-size="23" font-weight="700">Literature-Grounded Research</text>
    <text x="600" y="718" text-anchor="middle" font-size="15" fill="#445067">primary sources · lineage · contradictions · Hakken</text>
  </g>

  <rect x="420" y="380" width="360" height="126" rx="22" fill="#ffffff" fill-opacity="0.94" stroke="#273248" stroke-width="2"/>
  <text x="600" y="425" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="27" font-weight="800" fill="#172033">
    topological-spin-lab
  </text>
  <text x="600" y="458" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" fill="#445067">
    model → experiment → acceptance → evidence
  </text>
  <text x="600" y="484" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="14" fill="#687386">
    project identity — not a scientific result
  </text>
</svg>
